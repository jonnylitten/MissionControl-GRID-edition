[general]
; Enable vibration support for unofficial controllers [default true]
;enable_rumble=true
; Enable motion controls support for unoffical controllers [default true]
;enable_motion=true

[bluetooth]
; Override host name of Bluetooth adapter
;host_name=Nintendo Switch!
; Override host mac address of Bluetooth adapter
;host_address=04:20:69:04:20:69

[misc]
; Set the threshold for which ZL/ZR are considered pressed for controllers with analog triggers. Valid range [0-100] percent [default 50]
;analog_trigger_activation_threshold=50
; Enable pairing of Dualshock 3 controllers via USB. Disable to avoid conflicts with using the controller wired with sys-con [default true]
;dualshock3_enable_usb_pairing=true
; Set Dualshock 3 player LED behaviour. Valid modes [0-2] where 0=Switch pattern, 1=PS3 pattern, 2=Hybrid (Switch pattern reversed to line up with numeric labels on the controller) [default 0]
;dualshock3_led_mode=0
; Set polling rate for Sony Dualshock 4 controllers. Valid range [0-16] where 0=max, 16=min [default 8 (125Hz)]
; Refer to https://github.com/ndeadly/MissionControl/blob/4a0326308d1ff39353b045f5efb1a99c4a504c28/mc_mitm/source/controllers/dualshock4_controller.hpp#L21
;dualshock4_polling_rate=8
; Set LED lightbar brightness for Sony Dualshock 4 controllers. Valid range [0-9] where 0=off, 1=min, 2-9=12.5-100% [default 5(50%)]
;dualshock4_lightbar_brightness=4
; Set LED lightbar brightness for Sony Dualsense controllers. Valid range [0-9] where 0=off, 1=min, 2-9=12.5-100% [default 5(50%)]
;dualsense_lightbar_brightness=4
; Enable the white player indicator LEDs below the Dualsense touchpad [default true]
;dualsense_enable_player_leds=false
; Set Dualsense vibration intensity, 12.5% per increment. Valid range [1-8] where 1=12.5%, 8=100% [default 4(50%)]
;dualsense_vibration_intensity=4

[trigger_map]
; Configurable analog-trigger-to-stick remapping. Lets games like Grid Autosport
; or Mario Sunshine use bluetooth-controller analog triggers as throttle/brake/etc
; via the right-stick analog axis they already support.
;
; Per-controller and per-title overrides are also supported. Drop a [trigger_map]
; section into:
;   sdmc:/config/MissionControl/controllers/<lowercase-mac-no-separators>.ini
;   sdmc:/config/MissionControl/titles/<16-hex-program-id>.ini
; Precedence is per-title > per-controller > the [trigger_map] block in this file
; (whichever level matches first wins as a complete profile -- fields are not
; merged across levels).
;
; mode: off | rstick_y_split  (RT -> +Y, LT -> -Y on right stick) [default off]
;mode=off
; Threshold (0-100) on normalized RT before ZR also fires digitally. In modes
; that map a trigger to an analog stick axis the digital ZR is usually unwanted
; (e.g. Grid Autosport / Mario Sunshine read the analog axis, not ZR), so this
; defaults to "off". Set 0-100 to opt in (e.g. =95 makes a near-full RT pull
; act as a boost button). [default off]
;zr_threshold=off
; Threshold (0-100) on normalized LT before ZL also fires digitally, or "off"
; to disable. [default off]
;zl_threshold=off
; Deadzone (0-100) on the raw trigger before activation [default 0]
;deadzone=0
; Invert Y-axis direction (RT -> -Y, LT -> +Y) for games that expect the opposite
; convention [default false]
;invert_y=false
